plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asylum.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.asylum.game'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'GAME_SERVER_URL', "\"${project.findProperty('GAME_SERVER_URL') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
